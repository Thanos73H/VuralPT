<text x="675" y="470" font-family="Arial,sans-serif" font-size="15" fill="#667085">Kontrollü dönüş</text>
<rect x="60" y="550" width="780" height="95" rx="18" fill="#f8fbff" stroke="#d9e6ff"/>
<text x="85" y="585" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#101828">ÖNERİLEN BAŞLANGIÇ</text>
<text x="85" y="618" font-family="Arial,sans-serif" font-size="17" fill="#344054">2 set · 20–40 m tekrar · 90 sn dinlenme</text>
<text x="60" y="700" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#101828">NASIL YAPILIR?</text>
<text x="60" y="735" font-family="Arial,sans-serif" font-size="16" fill="#475467">Farmer Carry hareketini kontrollü tempoda, uygun eklem hizasını koruyarak ve hedef kası hissederek yap.</text>
<text x="60" y="760" font-family="Arial,sans-serif" font-size="16" fill="#475467"></text>
<text x="60" y="825" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#101828">DİKKAT</text>
<rect x="60" y="850" width="780" height="125" rx="18" fill="#fff8f6" stroke="#f2d6cf"/>
<text x="85" y="885" font-family="Arial,sans-serif" font-size="16" fill="#7a271a">Ağrı, baş dönmesi, olağandışı nefes darlığı veya kendini kötü hissetme durumunda egzersizi bırak. Bu bilg</text>
<text x="85" y="912" font-family="Arial,sans-serif" font-size="16" fill="#7a271a">i kişisel tıbbi değerlendirme yerine geçmez.</text>
<text x="60" y="1030" font-family="Arial,sans-serif" font-size="15" fill="#98a2b3">VuralPT · Görsel eğitim rehberi · Kişisel tıbbi değerlendirme yerine geçmez.</text>
